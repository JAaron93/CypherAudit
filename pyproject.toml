[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cypheraudit"
version = "0.1.0"
description = "SignalChain Oracle: Autonomous BigQuery Analytics Agent for Organic On-Chain Commerce & Macro UTXO Forensics on ASI Agentverse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uagents>=0.26.1",
    "google-cloud-bigquery>=3.47.0",
    "google-genai>=2.34.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20:uagents_core.*",
]

